name: Bug report
description: Report a problem with SimuGen or the public website
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with SimuGen.

        Do not include identifiable patient information, confidential information, API keys or other sensitive data.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where did the problem occur?
      options:
        - Clinical scenario generation
        - ChatGPT plugin behaviour
        - Website
        - Documentation
        - Plugin packaging or metadata
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem clearly.
      placeholder: Describe what you expected and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the minimum steps or prompt needed to reproduce the issue.
      placeholder: |
        1. Ask SimuGen to...
        2. Provide...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should SimuGen have done?
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add screenshots, logs or other useful context if relevant. Remove sensitive information first.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have checked that an existing issue does not already cover this problem.
          required: true
        - label: I have removed identifiable patient, confidential and sensitive personal information.
          required: true
