name: Release candidate checks

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Check out the pull request merge result
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Check plugin metadata, references and release ZIP
        run: npm run check:plugin

      - name: Build and verify the static site
        run: |
          npm run build
          test -s out/index.html
          test -s out/privacy/index.html
          test -s out/terms/index.html
