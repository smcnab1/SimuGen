# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-GB
tone_instructions: "Prioritise correctness, regressions, privacy and concrete failure scenarios. Avoid cosmetic preferences and speculative refactors. Keep findings concise."
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_instructions: "Summarise the practical impact in up to three short bullets."
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  collapse_walkthrough: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
  path_instructions:
    - path: "plugin/**"
      instructions: "Check manifest and skill references, scenario generation, review, simulation and debrief handoffs. Flag conflicting instructions, broken entry points, identifiable patient data or patient-specific advice. Preserve human clinical and editorial review."
    - path: "{app,components}/**"
      instructions: "Check keyboard navigation, focus, accessible names and responsive behaviour. Flag regressions in privacy disclosures or discrepancies between the website and the plugin's actual capabilities."
    - path: ".github/workflows/**"
      instructions: "Preserve locked builds, plugin validation, static site checks and existing publishing controls. Flag changes that could publish unreviewed content."
